<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>

<body>
    <main>
        <form action="/action">
            <div>
                <label for="username">
                username :
                <input type="text" placeholder="text" id="username">
            </label>
            </div>
            <br>
            <div>
                <label for="password">password :</label>
                <input type="password" placeholder="Enter password" id="password">
            </div>
            <br>
            <label for="number">
                number
                <input type="number" placeholder="number" id="number">
            </label>
            <br>
            <label for="time">
                set time
                <input type="time" placeholder="time" id="time">
            </label>

            <br>

            <label for="color">color :</label>
            <input type="color" placeholder="color" id="color">
            <br>

            <input type="image" placeholder="image">
            <br>
            <input type="file" placeholder="file">
            <br>
            <input type="range" placeholder="range">
            <br>
            <input type="radio" placeholder="radio">
            <br>
            <br>
            <button type="submit">Submit</button>
            <div>
                <input type="button" value="click me">
            </div>
            
        </form>
        <br>
        <button type="reset">Reset</button>
        <button type="submit">submit</button>
        <button type="button">click me</button>
    </main>
</body>

</html>
