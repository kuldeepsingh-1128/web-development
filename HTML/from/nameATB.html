<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <form action="server">
            <div>
            <label for="username">username :</label>
            <input type="text" id="username" placeholder="enter username" name="user">
            </div>

            <div>
            <label for="password">password :</label>
            <input type="password" placeholder="enter password" id="password" name="pass">
            </div>

            <div>
                <button type="submit">Submit</button>
            </div>
        </form>
        <!-- http://0.0.0.0:3000/HTML/from/server?username=1234 -->

        <form action="https://www.youtube.com/results">
            <hr>
            <input type="text" placeholder="search on youtube" name="search_query">
            <button>search</button>
        </form>

        <form action="https://www.google.com/search">
            <hr>
            <input type="text" placeholder="search on google" name="q">
            <button>search</button>
        </form>
        
    </main>
    
</body>
</html>
