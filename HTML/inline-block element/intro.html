<!-- inline= elements in a line (image,anchor tag)
block = elements not in a line  (heading,peragraph)

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- block elements -->

    <!-- heading -->
    <h1>hello</h1>
    <h1>world</h1>

    <!-- peragraph -->
    <p>hiii bro</p>
    <p>hello</p>

    
    <!-- inline elemennts -->
     <!-- anchor tag -->
    <a href="www.google.com">google</a>
    <a href="www.facebook.com">facebook</a>
    <div><a href="www.youtube.com">youtube</a></div>

    <!-- image -->
    <img src="" alt="">
    <img src="" alt="">
    

</body>
</html>
