<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container">
        <form action="www.google.com">
            <div class="row">
                <div class="mb-3 col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class=" form-control" placeholder="enter your Email..." id="email">
                </div>

                <div class="mb-3 col-md-6">
                    <label for="password" class="form-label">password</label>
                    <input type="password" class="form-control" placeholder="password" id="password">
                </div>
            </div>


            <div class="mb-3">
                <label for="address" class="form-label ">
                    Address
                </label>
                <input type="text" class="form-control" id="address" placeholder="Enter your address">
            </div>

            <div class="row">
                <div class="col-md-6">
                    <select class="form-select">
                        <option selected>select gender</option>
                        <option value="1">male</option>
                        <option value="2">female</option>
                        <option value="3">transgender</option>
                        <option value="4">none</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <select class="form-select">
                        <option selected>choose your city</option>
                        <option value="1">mumbai</option>
                        <option value="2">delhi</option>
                        <option value="3">jaipur</option>
                        <option value="4">goa</option>
                    </select>
                </div>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="checkbs" />
                <label class="form-check-label" for="checkbs"> you want to be successful? </label>
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" value="" id="check" />
                <label class="form-check-label" for="check"> switch</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" value="check" id="radiobtn" />
                <label class="form-check-label" for="radiobtn">Yes/no</label>
            </div>





            <button class="btn btn-primary">submit</button>
        </form>
    </div>

</body>

</html>
